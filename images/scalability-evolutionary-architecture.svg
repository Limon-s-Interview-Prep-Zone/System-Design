<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fb923c" />
    </marker>

    <!-- Filter Shadows -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .panel-header { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
    .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .badge-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .flow-line { stroke-width: 1.8; fill: none; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="860" fill="url(#bgGrad)" />

  <!-- Main Title Area -->
  <text x="50" y="45" class="title">System Scalability Evolution: From 1 to 10M+ Users</text>
  <text x="50" y="68" class="subtitle">Architectural milestones, database decoupling, multi-level caching, and distributed sharding</text>

  <!-- ========================================== -->
  <!-- MILESTONE 1: 1 - 10K Users (Monolith) -->
  <!-- ========================================== -->
  <g transform="translate(40, 95)" filter="url(#boxShadow)">
    <rect width="530" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stage Header Badge -->
    <rect x="16" y="16" width="130" height="26" rx="6" fill="#3b82f6" />
    <text x="81" y="33" text-anchor="middle" class="badge-txt">STAGE 1: 1 - 10K USERS</text>
    <text x="160" y="34" class="panel-header" fill="#60a5fa">Single Server Monolith</text>
    <text x="16" y="62" class="node-desc" fill="#64748b">Single virtual machine or container running Web API + Database together.</text>

    <!-- Client Node -->
    <rect x="25" y="140" width="100" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="75" y="162" text-anchor="middle" class="node-title">Web / Mobile</text>
    <text x="75" y="176" text-anchor="middle" class="node-desc">Client Apps</text>

    <!-- Arrow Client -> Monolith -->
    <path d="M 125 165 L 210 165" class="flow-line" stroke="#38bdf8" marker-end="url(#arrowBlue)" />
    <text x="167" y="155" text-anchor="middle" font-size="9" fill="#94a3b8">HTTP/S</text>

    <!-- Monolith Server Box -->
    <rect x="215" y="95" width="280" height="205" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5" />
    <text x="355" y="120" text-anchor="middle" font-weight="700" font-size="12" fill="#38bdf8">Single Server (e.g., AWS EC2 / VM)</text>

    <!-- Web App Component inside Monolith -->
    <rect x="235" y="135" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="355" y="160" text-anchor="middle" class="node-title">ASP.NET Core Web API</text>
    <text x="355" y="176" text-anchor="middle" class="node-desc">Monolithic App Logic &amp; Static Assets</text>

    <!-- Arrow Internal App -> DB -->
    <path d="M 355 195 L 355 218" class="flow-line" stroke="#94a3b8" marker-end="url(#arrow)" />
    <text x="390" y="210" text-anchor="start" font-size="9" fill="#94a3b8">Localhost</text>

    <!-- DB Component inside Monolith -->
    <rect x="235" y="225" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="355" y="250" text-anchor="middle" class="node-title">PostgreSQL / SQL Server</text>
    <text x="355" y="266" text-anchor="middle" class="node-desc">Co-located Single Database</text>

    <!-- Key Limitation -->
    <text x="25" y="320" font-size="10.5" fill="#f87171" font-weight="600">⚠ SPOF: Single point of failure; compute and disk contention.</text>
  </g>

  <!-- ========================================== -->
  <!-- MILESTONE 2: 10K - 100K Users (Decoupled) -->
  <!-- ========================================== -->
  <g transform="translate(630, 95)" filter="url(#boxShadow)">
    <rect width="530" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stage Header Badge -->
    <rect x="16" y="16" width="145" height="26" rx="6" fill="#10b981" />
    <text x="88" y="33" text-anchor="middle" class="badge-txt">STAGE 2: 10K - 100K USERS</text>
    <text x="175" y="34" class="panel-header" fill="#34d399">Decoupled Web + Read Replicas</text>
    <text x="16" y="62" class="node-desc" fill="#64748b">Load balancer distributes web traffic; Master-Replica splits read/write loads.</text>

    <!-- Client -->
    <rect x="20" y="145" width="70" height="45" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="55" y="168" text-anchor="middle" class="node-title">Client</text>
    <text x="55" y="180" text-anchor="middle" class="node-desc">Traffic</text>

    <!-- Arrow Client -> LB -->
    <path d="M 90 167 L 122 167" class="flow-line" stroke="#34d399" marker-end="url(#arrowGreen)" />

    <!-- Load Balancer -->
    <rect x="125" y="130" width="85" height="75" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="167" y="160" text-anchor="middle" class="node-title">Load Balancer</text>
    <text x="167" y="176" text-anchor="middle" class="node-desc">Nginx / ALB</text>
    <text x="167" y="190" text-anchor="middle" font-size="9" fill="#34d399">Health Checks</text>

    <!-- Split Arrows LB -> Web Servers -->
    <path d="M 210 150 L 255 125" class="flow-line" stroke="#34d399" marker-end="url(#arrowGreen)" />
    <path d="M 210 185 L 255 205" class="flow-line" stroke="#34d399" marker-end="url(#arrowGreen)" />

    <!-- Web Server 1 -->
    <rect x="260" y="105" width="105" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="312" y="128" text-anchor="middle" class="node-title">Web Node 1</text>
    <text x="312" y="140" text-anchor="middle" class="node-desc">Stateless C# API</text>

    <!-- Web Server 2 -->
    <rect x="260" y="185" width="105" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="312" y="208" text-anchor="middle" class="node-title">Web Node 2</text>
    <text x="312" y="220" text-anchor="middle" class="node-desc">Stateless C# API</text>

    <!-- Arrows to Database -->
    <path d="M 365 120 L 415 110" class="flow-line" stroke="#f97316" marker-end="url(#arrowOrange)" />
    <path d="M 365 210 L 415 220" class="flow-line" stroke="#38bdf8" marker-end="url(#arrowBlue)" />

    <!-- Primary DB -->
    <rect x="420" y="90" width="95" height="55" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <text x="467" y="114" text-anchor="middle" class="node-title" fill="#f97316">Primary DB</text>
    <text x="467" y="130" text-anchor="middle" class="node-desc">Writes Only</text>

    <!-- Replication Arrow -->
    <path d="M 467 145 L 467 188" class="flow-line" stroke="#94a3b8" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    <text x="475" y="170" font-size="8.5" fill="#94a3b8">Sync/Async</text>

    <!-- Replica DB -->
    <rect x="420" y="195" width="95" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="467" y="219" text-anchor="middle" class="node-title" fill="#38bdf8">Replica DB</text>
    <text x="467" y="235" text-anchor="middle" class="node-desc">Read Scale-Out</text>

    <!-- Key Insight -->
    <text x="20" y="320" font-size="10.5" fill="#34d399" font-weight="600">✔ Redundancy: Web tier scales horizontally; DB reads separated from writes.</text>
  </g>

  <!-- ========================================== -->
  <!-- MILESTONE 3: 100K - 1M Users (Cache + CDN) -->
  <!-- ========================================== -->
  <g transform="translate(40, 470)" filter="url(#boxShadow)">
    <rect width="530" height="355" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stage Header Badge -->
    <rect x="16" y="16" width="145" height="26" rx="6" fill="#8b5cf6" />
    <text x="88" y="33" text-anchor="middle" class="badge-txt">STAGE 3: 100K - 1M USERS</text>
    <text x="175" y="34" class="panel-header" fill="#c084fc">CDN, Redis Cache &amp; Async Workers</text>
    <text x="16" y="60" class="node-desc" fill="#64748b">Edge caching offloads static assets; Redis shields the database; Queues process async jobs.</text>

    <!-- Client -->
    <rect x="15" y="150" width="60" height="40" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="175" text-anchor="middle" class="node-title">Client</text>

    <!-- Path to CDN -->
    <path d="M 75 160 L 115 110" class="flow-line" stroke="#c084fc" marker-end="url(#arrowPurple)" />
    <!-- Path to L7 LB -->
    <path d="M 75 175 L 115 210" class="flow-line" stroke="#38bdf8" marker-end="url(#arrowBlue)" />

    <!-- CDN Node -->
    <rect x="120" y="85" width="85" height="50" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="162" y="108" text-anchor="middle" class="node-title">CDN (Edge)</text>
    <text x="162" y="122" text-anchor="middle" class="node-desc">Images, CSS, JS</text>

    <!-- L7 Gateway -->
    <rect x="120" y="185" width="85" height="55" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="162" y="208" text-anchor="middle" class="node-title">YARP / Envoy</text>
    <text x="162" y="222" text-anchor="middle" class="node-desc">L7 Reverse Proxy</text>

    <!-- Arrow LB -> App Cluster -->
    <path d="M 205 212 L 235 212" class="flow-line" stroke="#38bdf8" marker-end="url(#arrowBlue)" />

    <!-- Stateless App Cluster -->
    <rect x="240" y="165" width="105" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="292" y="190" text-anchor="middle" class="node-title">Stateless APIs</text>
    <text x="292" y="206" text-anchor="middle" class="node-desc">Auto-scaled Pods</text>
    <text x="292" y="222" text-anchor="middle" font-size="8.5" fill="#38bdf8">No Local State</text>
    <text x="292" y="240" text-anchor="middle" font-size="8.5" fill="#94a3b8">JWT Auth</text>

    <!-- Arrow App -> Redis -->
    <path d="M 292 165 L 292 135" class="flow-line" stroke="#f43f5e" marker-end="url(#arrow)" />
    <!-- Arrow App -> Queue -->
    <path d="M 292 260 L 292 288" class="flow-line" stroke="#f59e0b" marker-end="url(#arrow)" />

    <!-- Redis Cache -->
    <rect x="240" y="85" width="105" height="48" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="292" y="106" text-anchor="middle" class="node-title" fill="#f43f5e">Redis Cluster</text>
    <text x="292" y="120" text-anchor="middle" class="node-desc">L2 Distributed Cache</text>

    <!-- Message Broker -->
    <rect x="240" y="290" width="105" height="48" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="292" y="311" text-anchor="middle" class="node-title" fill="#f59e0b">RabbitMQ / Kafka</text>
    <text x="292" y="325" text-anchor="middle" class="node-desc">Message Broker</text>

    <!-- Arrow App -> DB -->
    <path d="M 345 200 L 405 180" class="flow-line" stroke="#94a3b8" marker-end="url(#arrow)" />
    <!-- Arrow Queue -> Workers -->
    <path d="M 345 315 L 405 315" class="flow-line" stroke="#f59e0b" marker-end="url(#arrow)" />

    <!-- DB Cluster -->
    <rect x="410" y="155" width="105" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="462" y="180" text-anchor="middle" class="node-title">Primary + Replicas</text>
    <text x="462" y="196" text-anchor="middle" class="node-desc">R/W Splitting</text>
    <text x="462" y="210" text-anchor="middle" font-size="8.5" fill="#34d399">80% Reads Saved by Cache</text>

    <!-- Background Workers -->
    <rect x="410" y="290" width="105" height="48" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="462" y="311" text-anchor="middle" class="node-title">Workers</text>
    <text x="462" y="325" text-anchor="middle" class="node-desc">Order / Email Jobs</text>
  </g>

  <!-- ========================================== -->
  <!-- MILESTONE 4: 10M+ Users (Global + Sharding) -->
  <!-- ========================================== -->
  <g transform="translate(630, 470)" filter="url(#boxShadow)">
    <rect width="530" height="355" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stage Header Badge -->
    <rect x="16" y="16" width="150" height="26" rx="6" fill="#ea580c" />
    <text x="91" y="33" text-anchor="middle" class="badge-txt">STAGE 4: 10M+ USERS</text>
    <text x="180" y="34" class="panel-header" fill="#fb923c">Global Multi-Region &amp; Sharding</text>
    <text x="16" y="60" class="node-desc" fill="#64748b">Anycast Geo-routing; Autonomous multi-region stacks; Consistent Hashing DB sharding.</text>

    <!-- Global DNS -->
    <rect x="20" y="160" width="95" height="55" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.5" />
    <text x="67" y="184" text-anchor="middle" class="node-title">Route 53 / GeoDNS</text>
    <text x="67" y="198" text-anchor="middle" class="node-desc">Latency Routing</text>

    <!-- Geo split lines -->
    <path d="M 115 175 L 165 125" class="flow-line" stroke="#fb923c" marker-end="url(#arrowOrange)" />
    <path d="M 115 195 L 165 240" class="flow-line" stroke="#fb923c" marker-end="url(#arrowOrange)" />

    <!-- Region US-East -->
    <rect x="170" y="85" width="155" height="100" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="247" y="108" text-anchor="middle" font-weight="700" font-size="11" fill="#38bdf8">Region: US-East</text>
    <text x="247" y="128" text-anchor="middle" class="node-desc">L4/L7 LB + K8s App Pods</text>
    <text x="247" y="144" text-anchor="middle" class="node-desc">Regional Redis L2 Cache</text>
    <text x="247" y="165" text-anchor="middle" font-size="9" fill="#10b981">Local Low Latency (&lt;20ms)</text>

    <!-- Region EU-West -->
    <rect x="170" y="210" width="155" height="100" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
    <text x="247" y="233" text-anchor="middle" font-weight="700" font-size="11" fill="#c084fc">Region: EU-West</text>
    <text x="247" y="253" text-anchor="middle" class="node-desc">L4/L7 LB + K8s App Pods</text>
    <text x="247" y="269" text-anchor="middle" class="node-desc">Regional Redis L2 Cache</text>
    <text x="247" y="290" text-anchor="middle" font-size="9" fill="#10b981">GDPR Compliant Data Edge</text>

    <!-- Connector to Shards -->
    <path d="M 325 135 L 365 185" class="flow-line" stroke="#94a3b8" marker-end="url(#arrow)" />
    <path d="M 325 260 L 365 210" class="flow-line" stroke="#94a3b8" marker-end="url(#arrow)" />

    <!-- Database Sharding Box -->
    <rect x="370" y="105" width="145" height="195" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.5" />
    <text x="442" y="128" text-anchor="middle" font-weight="700" font-size="11.5" fill="#fb923c">Consistent Hashing</text>
    <text x="442" y="143" text-anchor="middle" font-size="9" fill="#94a3b8">Partition Key: UserId</text>

    <!-- Shard 1 -->
    <rect x="382" y="152" width="120" height="38" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="442" y="169" text-anchor="middle" font-size="10" font-weight="600" fill="#f8fafc">Shard 1 (Users 0-3M)</text>
    <text x="442" y="181" text-anchor="middle" font-size="8.5" fill="#94a3b8">PostgreSQL Cluster</text>

    <!-- Shard 2 -->
    <rect x="382" y="196" width="120" height="38" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="442" y="213" text-anchor="middle" font-size="10" font-weight="600" fill="#f8fafc">Shard 2 (Users 3-7M)</text>
    <text x="442" y="225" text-anchor="middle" font-size="8.5" fill="#94a3b8">PostgreSQL Cluster</text>

    <!-- Shard 3 -->
    <rect x="382" y="240" width="120" height="38" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="442" y="257" text-anchor="middle" font-size="10" font-weight="600" fill="#f8fafc">Shard 3 (Users 7-10M+)</text>
    <text x="442" y="269" text-anchor="middle" font-size="8.5" fill="#94a3b8">PostgreSQL Cluster</text>

    <!-- Search / CDC Offload -->
    <text x="20" y="338" font-size="10" fill="#38bdf8" font-weight="600">⚡ CDC Engine (Debezium + Kafka) syncs cross-shard queries to Elasticsearch.</text>
  </g>
</svg>

