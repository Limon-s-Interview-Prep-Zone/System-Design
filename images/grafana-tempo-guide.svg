<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#111217; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181b1f" />
      <stop offset="100%" stop-color="#111217" />
    </linearGradient>
    <linearGradient id="blueBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3274d9" />
      <stop offset="100%" stop-color="#1f60c4" />
    </linearGradient>
    <linearGradient id="spanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5794f2" />
      <stop offset="100%" stop-color="#3274d9" />
    </linearGradient>
    <linearGradient id="spanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73bf69" />
      <stop offset="100%" stop-color="#56a64b" />
    </linearGradient>
    <linearGradient id="spanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b877d9" />
      <stop offset="100%" stop-color="#8f3bb8" />
    </linearGradient>
    <linearGradient id="spanOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9830" />
      <stop offset="100%" stop-color="#e07610" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Window Header -->
  <rect x="20" y="20" width="1060" height="640" rx="10" fill="url(#bgGrad)" stroke="#2c3235" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- App Top Navigation Bar -->
  <rect x="20" y="20" width="1060" height="50" rx="10" fill="#1e2226" />
  <circle cx="45" cy="45" r="6" fill="#eb5757" />
  <circle cx="65" cy="45" r="6" fill="#f2c94c" />
  <circle cx="85" cy="45" r="6" fill="#27ae60" />
  <text x="120" y="50" fill="#d8d9da" font-size="16" font-weight="600">Grafana Explore ➔ Tempo Distributed Tracing</text>

  <!-- Step 1: Datasource Dropdown -->
  <g transform="translate(480, 32)">
    <rect x="0" y="0" width="150" height="32" rx="4" fill="#262a2f" stroke="#3274d9" stroke-width="1.5" />
    <circle cx="16" cy="16" r="6" fill="#f05a28" />
    <text x="32" y="21" fill="#fff" font-size="13" font-weight="600">Tempo</text>
    <path d="M 130 14 L 135 19 L 140 14 Z" fill="#9fa7ac" />
    <!-- Callout 1 -->
    <circle cx="75" cy="-8" r="14" fill="#f05a28" />
    <text x="75" y="-3" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- Step 2: Time Range Picker -->
  <g transform="translate(650, 32)">
    <rect x="0" y="0" width="160" height="32" rx="4" fill="#262a2f" stroke="#464c54" stroke-width="1" />
    <path d="M 15 11 A 6 6 0 1 0 15 21 A 6 6 0 1 0 15 11 M 15 13 L 15 16 L 18 16" fill="none" stroke="#9fa7ac" stroke-width="1.5" />
    <text x="30" y="21" fill="#d8d9da" font-size="13">Last 1 hour</text>
    <path d="M 140 14 L 145 19 L 150 14 Z" fill="#9fa7ac" />
    <!-- Callout 2 -->
    <circle cx="80" cy="-8" r="14" fill="#f05a28" />
    <text x="80" y="-3" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">2</text>
  </g>

  <!-- Step 5: Run Query Button -->
  <g transform="translate(830, 32)">
    <rect x="0" y="0" width="130" height="32" rx="4" fill="url(#blueBtn)" />
    <polygon points="20,11 20,21 28,16" fill="#fff" />
    <text x="36" y="21" fill="#fff" font-size="13" font-weight="bold">Run query</text>
    <!-- Callout 5 -->
    <circle cx="140" cy="16" r="14" fill="#f05a28" />
    <text x="140" y="21" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">5</text>
  </g>

  <!-- Query Panel Container -->
  <g transform="translate(45, 90)">
    <rect x="0" y="0" width="1010" height="175" rx="6" fill="#181b1f" stroke="#2c3235" stroke-width="1" />

    <!-- Step 3: Query Tabs (Search, TraceQL, Trace ID) -->
    <g transform="translate(15, 12)">
      <rect x="0" y="0" width="85" height="28" rx="4" fill="#3274d9" />
      <text x="42" y="18" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Search</text>

      <rect x="95" y="0" width="85" height="28" rx="4" fill="#22252b" />
      <text x="137" y="18" fill="#9fa7ac" font-size="12" text-anchor="middle">TraceQL</text>

      <rect x="190" y="0" width="85" height="28" rx="4" fill="#22252b" />
      <text x="232" y="18" fill="#9fa7ac" font-size="12" text-anchor="middle">Trace ID</text>

      <!-- Callout 3 -->
      <circle cx="42" cy="-6" r="12" fill="#f05a28" />
      <text x="42" y="-2" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <!-- Query Inputs -->
    <!-- Service Name Dropdown (Step 4) -->
    <g transform="translate(15, 60)">
      <text x="0" y="15" fill="#9fa7ac" font-size="12" font-weight="bold">Service Name</text>
      <rect x="110" y="0" width="340" height="34" rx="4" fill="#141619" stroke="#3274d9" stroke-width="1.8" />
      <text x="125" y="22" fill="#73bf69" font-size="14" font-weight="600">SagaPatternWebApi</text>
      <path d="M 430 15 L 435 20 L 440 15 Z" fill="#9fa7ac" />
      <!-- Callout 4 -->
      <circle cx="280" cy="-6" r="14" fill="#f05a28" />
      <text x="280" y="-1" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">4</text>
    </g>

    <!-- Span Name (Optional) -->
    <g transform="translate(480, 60)">
      <text x="0" y="15" fill="#9fa7ac" font-size="12" font-weight="bold">Span Name</text>
      <rect x="95" y="0" width="380" height="34" rx="4" fill="#141619" stroke="#373c44" stroke-width="1" />
      <text x="110" y="22" fill="#d8d9da" font-size="13">POST api/Orders/checkout (or leave empty)</text>
      <path d="M 455 15 L 460 20 L 465 15 Z" fill="#9fa7ac" />
    </g>

    <!-- Filter Tips -->
    <g transform="translate(15, 120)">
      <rect x="0" y="0" width="980" height="38" rx="4" fill="#1e2226" stroke="#2c3235" stroke-width="1" />
      <text x="15" y="24" fill="#ff9830" font-size="12" font-weight="bold">💡 Pro-Tip:</text>
      <text x="85" y="24" fill="#c7d0d9" font-size="12">If you know the TraceId, click the </text>
      <text x="290" y="24" fill="#5794f2" font-size="12" font-weight="bold">[Trace ID]</text>
      <text x="355" y="24" fill="#c7d0d9" font-size="12"> tab and paste e.g. </text>
      <text x="470" y="24" fill="#73bf69" font-family="monospace" font-size="12">77101a4a3bbf8fefbce2261b211dc54f</text>
      <text x="740" y="24" fill="#c7d0d9" font-size="12"> to open it instantly!</text>
    </g>
  </g>

  <!-- Step 6: Trace Waterfall Gantt Chart -->
  <g transform="translate(45, 285)">
    <rect x="0" y="0" width="1010" height="350" rx="6" fill="#181b1f" stroke="#2c3235" stroke-width="1" />

    <!-- Waterfall Header -->
    <rect x="0" y="0" width="1010" height="42" rx="6" fill="#202428" />
    <text x="20" y="26" fill="#fff" font-size="14" font-weight="bold">Trace Results: TraceId 77101a4a3bbf8fefbce2261b211dc54f (8 Spans, 185 ms)</text>
    <!-- Callout 6 -->
    <circle cx="890" cy="21" r="14" fill="#f05a28" />
    <text x="890" y="26" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="915" y="26" fill="#ff9830" font-size="12" font-weight="bold">Click to view Gantt</text>

    <!-- Time Scale Axes -->
    <line x1="380" y1="42" x2="380" y2="340" stroke="#2c3235" stroke-dasharray="3 3" />
    <line x1="530" y1="42" x2="530" y2="340" stroke="#2c3235" stroke-dasharray="3 3" />
    <line x1="680" y1="42" x2="680" y2="340" stroke="#2c3235" stroke-dasharray="3 3" />
    <line x1="830" y1="42" x2="830" y2="340" stroke="#2c3235" stroke-dasharray="3 3" />
    <line x1="980" y1="42" x2="980" y2="340" stroke="#2c3235" stroke-dasharray="3 3" />

    <text x="380" y="58" fill="#6e7681" font-size="10" text-anchor="middle">0 ms</text>
    <text x="530" y="58" fill="#6e7681" font-size="10" text-anchor="middle">45 ms</text>
    <text x="680" y="58" fill="#6e7681" font-size="10" text-anchor="middle">90 ms</text>
    <text x="830" y="58" fill="#6e7681" font-size="10" text-anchor="middle">135 ms</text>
    <text x="980" y="58" fill="#6e7681" font-size="10" text-anchor="middle">185 ms</text>

    <!-- Span 1: HTTP POST -->
    <g transform="translate(15, 75)">
      <text x="10" y="16" fill="#e1e4e8" font-size="12" font-weight="bold">POST api/Orders/checkout</text>
      <rect x="365" y="2" width="600" height="20" rx="3" fill="url(#spanBlue)" opacity="0.9" />
      <text x="975" y="16" fill="#fff" font-size="11" font-weight="bold">185ms</text>
    </g>

    <!-- Span 2: SubmitOrderCommand send -->
    <g transform="translate(30, 110)">
      <text x="10" y="16" fill="#8b949e" font-size="12">└─ SubmitOrderCommand send (MassTransit)</text>
      <rect x="390" y="2" width="60" height="20" rx="3" fill="url(#spanOrange)" />
      <text x="460" y="16" fill="#9fa7ac" font-size="11">12ms</text>
    </g>

    <!-- Span 3: OrderCommand process -->
    <g transform="translate(45, 145)">
      <text x="10" y="16" fill="#8b949e" font-size="12">└─ OrderCommand process (Consumer)</text>
      <rect x="420" y="2" width="160" height="20" rx="3" fill="url(#spanGreen)" />
      <text x="590" y="16" fill="#9fa7ac" font-size="11">38ms</text>
    </g>

    <!-- Span 4: SQLite INSERT -->
    <g transform="translate(60, 180)">
      <text x="10" y="16" fill="#8b949e" font-size="12">└─ INSERT INTO Orders (EF Core)</text>
      <rect x="440" y="2" width="70" height="20" rx="3" fill="url(#spanPurple)" />
      <text x="520" y="16" fill="#9fa7ac" font-size="11">14ms</text>
    </g>

    <!-- Span 5: OrderState process (Saga) -->
    <g transform="translate(45, 215)">
      <text x="10" y="16" fill="#8b949e" font-size="12">└─ OrderState process (Saga: Submitted)</text>
      <rect x="520" y="2" width="110" height="20" rx="3" fill="url(#spanOrange)" />
      <text x="640" y="16" fill="#9fa7ac" font-size="11">24ms</text>
    </g>

    <!-- Span 6: InventoryCommand process -->
    <g transform="translate(60, 250)">
      <text x="10" y="16" fill="#8b949e" font-size="12">└─ InventoryCommand process (Stock Reserved)</text>
      <rect x="620" y="2" width="140" height="20" rx="3" fill="url(#spanGreen)" />
      <text x="770" y="16" fill="#9fa7ac" font-size="11">32ms</text>
    </g>

    <!-- Span 7: PaymentCommand process -->
    <g transform="translate(60, 285)">
      <text x="10" y="16" fill="#8b949e" font-size="12">└─ PaymentCommand process (Payment Charged)</text>
      <rect x="750" y="2" width="180" height="20" rx="3" fill="url(#spanGreen)" />
      <text x="940" y="16" fill="#9fa7ac" font-size="11">41ms</text>
    </g>
  </g>
</svg>
