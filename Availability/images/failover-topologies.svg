<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .card { rx: 8; stroke-width: 1.5; fill: #ffffff; filter: url(#shadow); }
    .header-badge { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .node-title { font-size: 11.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .node-sub { font-size: 9.5px; fill: #64748b; text-anchor: middle; }
    .desc { font-size: 10px; fill: #334155; }
    .bold { font-weight: 600; }
  </style>

  <!-- Title -->
  <text x="510" y="32" class="title">Failover Topologies &amp; Consensus Architecture</text>
  <text x="510" y="52" class="subtitle">Comparing Active-Passive, Active-Active, and Distributed Consensus Quorum with Split-Brain Protection</text>

  <!-- COLUMN 1: ACTIVE-PASSIVE -->
  <g transform="translate(20, 75)">
    <rect width="310" height="520" class="card" stroke="#cbd5e1" fill="#f8fafc"/>
    <rect x="15" y="15" width="180" height="26" rx="4" fill="#fee2e2"/>
    <text x="105" y="32" class="header-badge" fill="#991b1b">Pattern 1: Active-Passive (Hot)</text>

    <!-- Client / VIP -->
    <rect x="90" y="55" width="130" height="35" rx="5" fill="#ffffff" stroke="#94a3b8" filter="url(#shadow)"/>
    <text x="155" y="73" class="node-title">Virtual IP / DNS</text>
    <text x="155" y="85" class="node-sub">Health Checked Endpoint</text>

    <!-- Active Node -->
    <rect x="25" y="125" width="115" height="75" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="148" class="node-title" fill="#047857">Node A (Active)</text>
    <text x="82" y="165" class="node-sub">100% Live Traffic</text>
    <text x="82" y="180" font-size="9" fill="#059669" font-weight="700" text-anchor="middle">Primary Writer</text>

    <!-- Passive Node -->
    <rect x="170" y="125" width="115" height="75" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="227" y="148" class="node-title" fill="#475569">Node B (Passive)</text>
    <text x="227" y="165" class="node-sub">0% Traffic (Standby)</text>
    <text x="227" y="180" font-size="9" fill="#64748b" font-weight="600" text-anchor="middle">Hot Replica</text>

    <!-- Traffic Arrows -->
    <line x1="130" y1="90" x2="82" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
    <line x1="180" y1="90" x2="227" y2="120" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <text x="235" y="105" font-size="8.5" fill="#dc2626">No Traffic</text>

    <!-- Sync Heartbeat & Replication -->
    <path d="M 140 150 L 170 150" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
    <text x="155" y="143" font-size="8.5" fill="#2563eb" text-anchor="middle">Replication</text>

    <path d="M 170 175 L 140 175" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-navy)"/>
    <text x="155" y="188" font-size="8.5" fill="#b45309" text-anchor="middle">Heartbeat</text>

    <!-- Failover Event Box -->
    <rect x="25" y="225" width="260" height="90" rx="5" fill="#ffffff" stroke="#fca5a5"/>
    <text x="35" y="243" font-size="10.5" font-weight="700" fill="#991b1b">Failover Event Sequence:</text>
    <text x="35" y="260" class="desc">1. Node A crashes / heartbeat lost.</text>
    <text x="35" y="275" class="desc">2. Watchdog / Health Check detects timeout.</text>
    <text x="35" y="290" class="desc">3. Node B promoted to Active Primary.</text>
    <text x="35" y="305" class="desc">4. Virtual IP / DNS switches to Node B.</text>

    <!-- Trade-offs -->
    <rect x="15" y="335" width="280" height="165" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="355" font-size="11" font-weight="700" fill="#0f172a">Trade-offs &amp; Characteristics:</text>
    <text x="25" y="375" class="desc">✓ <tspan class="bold">No dual-write conflicts:</tspan> 1 single primary writer.</text>
    <text x="25" y="393" class="desc">✓ <tspan class="bold">Simple data consistency:</tspan> Standard replication.</text>
    <text x="25" y="411" class="desc" fill="#dc2626">✗ <tspan class="bold">Wasted resources:</tspan> Standby server sits 100% idle.</text>
    <text x="25" y="429" class="desc" fill="#dc2626">✗ <tspan class="bold">Failover warm-up lag:</tspan> Connection pooling &amp; caches cold.</text>
    <text x="25" y="447" class="desc" fill="#dc2626">✗ <tspan class="bold">RTO &gt; 0:</tspan> DNS propagation delay (TTL) causes downtime.</text>
    <text x="25" y="465" class="desc" fill="#475569">💡 <tspan class="bold">Standby Types:</tspan> Cold (off), Warm (partial), Hot (live).</text>
  </g>


  <!-- COLUMN 2: ACTIVE-ACTIVE -->
  <g transform="translate(355, 75)">
    <rect width="310" height="520" class="card" stroke="#93c5fd" fill="#eff6ff"/>
    <rect x="15" y="15" width="180" height="26" rx="4" fill="#dbeafe"/>
    <text x="105" y="32" class="header-badge" fill="#1e40af">Pattern 2: Active-Active (Live)</text>

    <!-- Global Load Balancer -->
    <rect x="80" y="55" width="150" height="35" rx="5" fill="#ffffff" stroke="#3b82f6" filter="url(#shadow)"/>
    <text x="155" y="73" class="node-title">Anycast / GSLB</text>
    <text x="155" y="85" class="node-sub">Global Traffic Distribution</text>

    <!-- Active Node 1 -->
    <rect x="25" y="125" width="115" height="75" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="82" y="148" class="node-title" fill="#047857">Region A (Active)</text>
    <text x="82" y="165" class="node-sub">50% Live Traffic</text>
    <text x="82" y="180" font-size="9" fill="#059669" font-weight="700" text-anchor="middle">Live Processing</text>

    <!-- Active Node 2 -->
    <rect x="170" y="125" width="115" height="75" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="227" y="148" class="node-title" fill="#047857">Region B (Active)</text>
    <text x="227" y="165" class="node-sub">50% Live Traffic</text>
    <text x="227" y="180" font-size="9" fill="#059669" font-weight="700" text-anchor="middle">Live Processing</text>

    <!-- Traffic Arrows -->
    <line x1="130" y1="90" x2="82" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
    <line x1="180" y1="90" x2="227" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Bi-directional Sync -->
    <path d="M 140 155 L 170 155" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-navy)"/>
    <path d="M 170 170 L 140 170" stroke="#6366f1" stroke-width="2" marker-end="url(#arr-navy)"/>
    <text x="155" y="145" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">Bi-directional</text>
    <text x="155" y="185" font-size="8" font-weight="700" fill="#4338ca" text-anchor="middle">Replication / CRDT</text>

    <!-- Failover Event Box -->
    <rect x="25" y="225" width="260" height="90" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="35" y="243" font-size="10.5" font-weight="700" fill="#1e40af">Failure Handling Sequence:</text>
    <text x="35" y="260" class="desc">1. Region A suffers total blackout.</text>
    <text x="35" y="275" class="desc">2. GSLB health check drops Region A immediately.</text>
    <text x="35" y="290" class="desc">3. 100% traffic routed smoothly to Region B.</text>
    <text x="35" y="305" class="desc">4. Zero downtime (RTO ≈ 0 sec).</text>

    <!-- Trade-offs -->
    <rect x="15" y="335" width="280" height="165" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="355" font-size="11" font-weight="700" fill="#0f172a">Trade-offs &amp; Characteristics:</text>
    <text x="25" y="375" class="desc">✓ <tspan class="bold">Zero downtime (RTO ≈ 0):</tspan> Both nodes already warm.</text>
    <text x="25" y="393" class="desc">✓ <tspan class="bold">Full resource efficiency:</tspan> All hardware serves requests.</text>
    <text x="25" y="411" class="desc" fill="#dc2626">✗ <tspan class="bold">Data Conflict Complexity:</tspan> Dual write conflicts require CRDTs.</text>
    <text x="25" y="429" class="desc" fill="#dc2626">✗ <tspan class="bold">Capacity Headroom Rule:</tspan> Each region must operate ≤ 50% capacity.</text>
    <text x="25" y="447" class="desc" fill="#dc2626">✗ <tspan class="bold">Expensive &amp; Complex:</tspan> Requires multi-region replication.</text>
    <text x="25" y="465" class="desc" fill="#475569">💡 <tspan class="bold">Sweet Spot:</tspan> Stateless services or partitioned keys.</text>
  </g>


  <!-- COLUMN 3: CONSENSUS & SPLIT-BRAIN -->
  <g transform="translate(690, 75)">
    <rect width="310" height="520" class="card" stroke="#86efac" fill="#f0fdf4"/>
    <rect x="15" y="15" width="200" height="26" rx="4" fill="#dcfce7"/>
    <text x="115" y="32" class="header-badge" fill="#15803d">Pattern 3: Quorum &amp; Consensus</text>

    <!-- Cluster Title -->
    <rect x="60" y="55" width="190" height="35" rx="5" fill="#ffffff" stroke="#10b981" filter="url(#shadow)"/>
    <text x="155" y="73" class="node-title">Raft / Paxos / etcd</text>
    <text x="155" y="85" class="node-sub">Quorum Formula: Q = ⌊N/2⌋ + 1</text>

    <!-- 3-Node Cluster -->
    <!-- Node 1 (Leader) -->
    <rect x="105" y="110" width="100" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="155" y="132" class="node-title" fill="#b45309">Node 1 (Leader)</text>
    <text x="155" y="148" font-size="9" fill="#92400e" text-anchor="middle">Holds Lease / Token</text>

    <!-- Node 2 (Follower) -->
    <rect x="30" y="175" width="100" height="45" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="80" y="196" class="node-title">Node 2 (Follower)</text>
    <text x="80" y="210" font-size="8.5" fill="#64748b" text-anchor="middle">Voter in Quorum</text>

    <!-- Node 3 (Follower) -->
    <rect x="180" y="175" width="100" height="45" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="230" y="196" class="node-title">Node 3 (Follower)</text>
    <text x="230" y="210" font-size="8.5" fill="#64748b" text-anchor="middle">Voter in Quorum</text>

    <!-- Network Partition Wall -->
    <line x1="155" y1="235" x2="155" y2="315" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="120" y="260" width="70" height="20" rx="3" fill="#fee2e2" stroke="#ef4444"/>
    <text x="155" y="274" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">Network Cut</text>

    <!-- Split Brain Prevention -->
    <rect x="25" y="235" width="85" height="75" rx="4" fill="#f8fafc" stroke="#64748b"/>
    <text x="67" y="255" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">Side A (1 Node)</text>
    <text x="67" y="272" font-size="8" fill="#dc2626" text-anchor="middle">1 &lt; Quorum (2)</text>
    <text x="67" y="292" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="middle">➔ CANNOT WRITE</text>

    <rect x="200" y="235" width="85" height="75" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="242" y="255" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">Side B (2 Nodes)</text>
    <text x="242" y="272" font-size="8" fill="#059669" text-anchor="middle">2 ≥ Quorum (2)</text>
    <text x="242" y="292" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">➔ ELECTS LEADER</text>

    <!-- Trade-offs -->
    <rect x="15" y="335" width="280" height="165" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="355" font-size="11" font-weight="700" fill="#0f172a">Trade-offs &amp; Split-Brain Protection:</text>
    <text x="25" y="375" class="desc">✓ <tspan class="bold">Split-Brain Proof:</tspan> Minority partition cannot write.</text>
    <text x="25" y="393" class="desc">✓ <tspan class="bold">Automated Consensus:</tspan> No manual human intervention.</text>
    <text x="25" y="411" class="desc">✓ <tspan class="bold">Fencing Tokens:</tspan> Old leader's write discarded by DB.</text>
    <text x="25" y="429" class="desc" fill="#dc2626">✗ <tspan class="bold">Odd Node Requirement:</tspan> Requires 3, 5, or 7 nodes.</text>
    <text x="25" y="447" class="desc" fill="#dc2626">✗ <tspan class="bold">Write Latency Tax:</tspan> Roundtrip to majority before commit.</text>
    <text x="25" y="465" class="desc" fill="#475569">💡 <tspan class="bold">Engines:</tspan> etcd, Consul, Zookeeper, Patroni.</text>
  </g>
</svg>
