<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .card { rx: 8; stroke-width: 1.5; fill: #ffffff; filter: url(#shadow); }
    .header-text { font-size: 13px; font-weight: 700; }
    .metric-title { font-size: 11.5px; font-weight: 700; fill: #0f172a; }
    .metric-val { font-size: 11px; font-weight: 600; }
    .desc { font-size: 10.5px; fill: #334155; }
    .bold { font-weight: 600; }
  </style>

  <!-- Title & Subtitle -->
  <text x="510" y="32" class="title">Disaster Recovery (DR) Strategies: RTO, RPO &amp; Cost Trade-offs</text>
  <text x="510" y="52" class="subtitle">Balancing business continuity, acceptable data loss, recovery duration, and cloud infrastructure investment</text>

  <!-- TOP SECTION: RTO vs RPO DEFINITIONS -->
  <g transform="translate(30, 75)">
    <rect width="960" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
    
    <!-- Timeline Line -->
    <line x1="80" y1="52" x2="880" y2="52" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Disaster Point -->
    <circle cx="480" cy="52" r="7" fill="#dc2626"/>
    <text x="480" y="28" font-size="11.5" font-weight="700" fill="#dc2626" text-anchor="middle">⚡ DISASTER EVENT</text>

    <!-- RPO Bracket (Left) -->
    <line x1="220" y1="42" x2="220" y2="62" stroke="#d97706" stroke-width="2"/>
    <line x1="220" y1="52" x2="470" y2="52" stroke="#d97706" stroke-width="3"/>
    <polygon points="460,47 475,52 460,57" fill="#d97706"/>
    <text x="350" y="42" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">◄ RPO (Recovery Point Objective)</text>
    <text x="350" y="72" font-size="9.5" fill="#78350f" text-anchor="middle">Maximum acceptable DATA LOSS duration (Last backup / sync)</text>

    <!-- RTO Bracket (Right) -->
    <line x1="740" y1="42" x2="740" y2="62" stroke="#2563eb" stroke-width="2"/>
    <line x1="490" y1="52" x2="740" y2="52" stroke="#2563eb" stroke-width="3"/>
    <polygon points="730,47 745,52 730,57" fill="#2563eb"/>
    <text x="615" y="42" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">RTO (Recovery Time Objective) ►</text>
    <text x="615" y="72" font-size="9.5" fill="#1e40af" text-anchor="middle">Maximum acceptable DOWNTIME duration until system is restored</text>
  </g>

  <!-- BOTTOM SECTION: THE 4 DR TIERS COMPARISON -->
  <!-- Tier 1: Backup & Restore -->
  <g transform="translate(30, 185)">
    <rect width="225" height="370" class="card" stroke="#cbd5e1" fill="#ffffff"/>
    <rect width="225" height="34" rx="8" fill="#f1f5f9"/>
    <text x="112" y="22" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">1. Backup &amp; Restore</text>

    <rect x="15" y="48" width="195" height="60" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="68" class="metric-title">RTO: <tspan class="metric-val" fill="#dc2626">24+ Hours</tspan></text>
    <text x="25" y="86" class="metric-title">RPO: <tspan class="metric-val" fill="#dc2626">Hours – Days</tspan></text>
    <text x="25" y="102" class="metric-title">Cost: <tspan class="metric-val" fill="#059669">$ (Very Low)</tspan></text>

    <!-- Visual Architecture -->
    <rect x="25" y="125" width="175" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="112" y="145" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Nightly DB Snapshots</text>
    <text x="112" y="158" font-size="8.5" fill="#64748b" text-anchor="middle">Stored in S3 / Azure Blob</text>

    <text x="112" y="195" font-size="14" fill="#94a3b8" text-anchor="middle">⬇ Restore when needed</text>

    <rect x="25" y="210" width="175" height="40" rx="4" fill="#fef2f2" stroke="#f87171" stroke-dasharray="3,3"/>
    <text x="112" y="230" font-size="10" font-weight="600" fill="#991b1b" text-anchor="middle">No Standby Infrastructure</text>
    <text x="112" y="243" font-size="8.5" fill="#dc2626" text-anchor="middle">Must provision VMs &amp; restore data</text>

    <!-- Summary -->
    <rect x="12" y="265" width="201" height="95" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="285" class="desc">• <tspan class="bold">Trade-off:</tspan> Dirt cheap storage.</text>
    <text x="20" y="303" class="desc">• Huge downtime during restore.</text>
    <text x="20" y="321" class="desc">• <tspan class="bold">Best For:</tspan> Internal batch apps,</text>
    <text x="20" y="339" class="desc">non-critical internal tooling.</text>
  </g>

  <!-- Tier 2: Pilot Light -->
  <g transform="translate(275, 185)">
    <rect width="225" height="370" class="card" stroke="#93c5fd" fill="#ffffff"/>
    <rect width="225" height="34" rx="8" fill="#eff6ff"/>
    <text x="112" y="22" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">2. Pilot Light</text>

    <rect x="15" y="48" width="195" height="60" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="68" class="metric-title">RTO: <tspan class="metric-val" fill="#d97706">10s of Minutes</tspan></text>
    <text x="25" y="86" class="metric-title">RPO: <tspan class="metric-val" fill="#059669">Seconds – Minutes</tspan></text>
    <text x="25" y="102" class="metric-title">Cost: <tspan class="metric-val" fill="#059669">$$ (Low - Moderate)</tspan></text>

    <!-- Visual Architecture -->
    <rect x="25" y="125" width="175" height="40" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="112" y="145" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">Continuous DB Replication</text>
    <text x="112" y="158" font-size="8.5" fill="#059669" text-anchor="middle">Live DB replica always synced</text>

    <text x="112" y="195" font-size="14" fill="#3b82f6" text-anchor="middle">⬇ Spin up compute</text>

    <rect x="25" y="210" width="175" height="40" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-dasharray="3,3"/>
    <text x="112" y="230" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">Compute is OFF / AMIs</text>
    <text x="112" y="243" font-size="8.5" fill="#2563eb" text-anchor="middle">Spins up via Terraform/IaC on DR</text>

    <!-- Summary -->
    <rect x="12" y="265" width="201" height="95" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="285" class="desc">• <tspan class="bold">Trade-off:</tspan> Low compute idle cost.</text>
    <text x="20" y="303" class="desc">• Data is safe &amp; continuously synced.</text>
    <text x="20" y="321" class="desc">• <tspan class="bold">Best For:</tspan> Core business systems</text>
    <text x="20" y="339" class="desc">tolerating ~30 min boot downtime.</text>
  </g>

  <!-- Tier 3: Warm Standby -->
  <g transform="translate(520, 185)">
    <rect width="225" height="370" class="card" stroke="#fcd34d" fill="#ffffff"/>
    <rect width="225" height="34" rx="8" fill="#fefce8"/>
    <text x="112" y="22" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">3. Warm Standby</text>

    <rect x="15" y="48" width="195" height="60" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="68" class="metric-title">RTO: <tspan class="metric-val" fill="#059669">Minutes (1–5 min)</tspan></text>
    <text x="25" y="86" class="metric-title">RPO: <tspan class="metric-val" fill="#059669">Seconds</tspan></text>
    <text x="25" y="102" class="metric-title">Cost: <tspan class="metric-val" fill="#d97706">$$$ (Moderate - High)</tspan></text>

    <!-- Visual Architecture -->
    <rect x="25" y="125" width="175" height="40" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="112" y="145" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">Live Synced Database</text>
    <text x="112" y="158" font-size="8.5" fill="#059669" text-anchor="middle">Warm read/write replica</text>

    <text x="112" y="195" font-size="14" fill="#eab308" text-anchor="middle">⬇ Scale up pods</text>

    <rect x="25" y="210" width="175" height="40" rx="4" fill="#fef9c3" stroke="#eab308"/>
    <text x="112" y="230" font-size="10" font-weight="600" fill="#854d0e" text-anchor="middle">Scaled-Down Live Compute</text>
    <text x="112" y="243" font-size="8.5" fill="#a16207" text-anchor="middle">Small cluster runs 24/7 (e.g., 2 pods)</text>

    <!-- Summary -->
    <rect x="12" y="265" width="201" height="95" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="285" class="desc">• <tspan class="bold">Trade-off:</tspan> Faster failover.</text>
    <text x="20" y="303" class="desc">• Just needs auto-scale trigger.</text>
    <text x="20" y="321" class="desc">• <tspan class="bold">Best For:</tspan> Critical SaaS,</text>
    <text x="20" y="339" class="desc">high-transaction e-commerce.</text>
  </g>

  <!-- Tier 4: Multi-Region Active-Active -->
  <g transform="translate(765, 185)">
    <rect width="225" height="370" class="card" stroke="#86efac" fill="#ffffff"/>
    <rect width="225" height="34" rx="8" fill="#f0fdf4"/>
    <text x="112" y="22" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">4. Multi-Region Active-Active</text>

    <rect x="15" y="48" width="195" height="60" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="25" y="68" class="metric-title">RTO: <tspan class="metric-val" fill="#059669">Near Zero (≈ 0 sec)</tspan></text>
    <text x="25" y="86" class="metric-title">RPO: <tspan class="metric-val" fill="#059669">Near Zero (≈ 0)</tspan></text>
    <text x="25" y="102" class="metric-title">Cost: <tspan class="metric-val" fill="#dc2626">$$$$$ (Extreme)</tspan></text>

    <!-- Visual Architecture -->
    <rect x="25" y="125" width="175" height="40" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="112" y="145" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">Multi-Region Multi-Master</text>
    <text x="112" y="158" font-size="8.5" fill="#059669" text-anchor="middle">Cosmos DB / Cockroach / Spanner</text>

    <text x="112" y="195" font-size="14" fill="#10b981" text-anchor="middle">⬇ Full live traffic</text>

    <rect x="25" y="210" width="175" height="40" rx="4" fill="#dcfce7" stroke="#10b981"/>
    <text x="112" y="230" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">100% Full-Capacity Compute</text>
    <text x="112" y="243" font-size="8.5" fill="#047857" text-anchor="middle">Both regions actively serving users</text>

    <!-- Summary -->
    <rect x="12" y="265" width="201" height="95" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="285" class="desc">• <tspan class="bold">Trade-off:</tspan> Zero perceived downtime.</text>
    <text x="20" y="303" class="desc">• Maximum complexity &amp; dual-write tax.</text>
    <text x="20" y="321" class="desc">• <tspan class="bold">Best For:</tspan> Tier-0 finance,</text>
    <text x="20" y="339" class="desc">global payments (Visa, Netflix).</text>
  </g>
</svg>
