<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .state-card { rx: 12; stroke-width: 2; filter: url(#shadow); }
    .state-title { font-size: 16px; font-weight: 800; text-anchor: middle; }
    .state-badge { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .item-text { font-size: 11px; fill: #334155; }
    .trans-label { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .trans-sub { font-size: 9.5px; fill: #64748b; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="480" y="32" class="title">Circuit Breaker Pattern State Machine</text>
  <text x="480" y="52" class="subtitle">Preventing cascading microservice collapse through fail-fast isolation and automatic recovery</text>

  <!-- 1. CLOSED STATE (Normal) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="250" height="230" fill="#f0fdf4" stroke="#16a34a" class="state-card"/>
    <rect x="25" y="15" width="200" height="28" rx="6" fill="#dcfce7"/>
    <text x="125" y="34" class="state-title" fill="#15803d">🟢 CLOSED</text>
    
    <text x="125" y="65" class="state-badge" fill="#166534">Normal System Operation</text>
    <line x1="20" y1="75" x2="230" y2="75" stroke="#bbf7d0" stroke-width="1.5"/>

    <text x="25" y="100" class="item-text">• Requests pass freely to service.</text>
    <text x="25" y="125" class="item-text">• Metrics tracked in rolling window.</text>
    <text x="25" y="150" class="item-text">• Failure count monitored.</text>
    <text x="25" y="175" class="item-text">• Success resets error counters.</text>
    
    <rect x="20" y="195" width="210" height="22" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="125" y="210" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">Traffic Status: 100% Flowing</text>
  </g>

  <!-- 2. OPEN STATE (Failing Fast) -->
  <g transform="translate(650, 100)">
    <rect x="0" y="0" width="250" height="230" fill="#fef2f2" stroke="#dc2626" class="state-card"/>
    <rect x="25" y="15" width="200" height="28" rx="6" fill="#fee2e2"/>
    <text x="125" y="34" class="state-title" fill="#b91c1c">🔴 OPEN</text>

    <text x="125" y="65" class="state-badge" fill="#991b1b">Fail-Fast Isolation</text>
    <line x1="20" y1="75" x2="230" y2="75" stroke="#fecaca" stroke-width="1.5"/>

    <text x="25" y="100" class="item-text">• All requests blocked immediately.</text>
    <text x="25" y="125" class="item-text">• No network calls to backend.</text>
    <text x="25" y="150" class="item-text">• Returns Fallback or HTTP 503.</text>
    <text x="25" y="175" class="item-text">• Prevents cascading thread exhaustion.</text>

    <rect x="20" y="195" width="210" height="22" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="125" y="210" font-size="10" font-weight="600" fill="#b91c1c" text-anchor="middle">Traffic Status: 0% Blocked / Fail Fast</text>
  </g>

  <!-- 3. HALF-OPEN STATE (Testing Recovery) -->
  <g transform="translate(355, 300)">
    <rect x="0" y="0" width="250" height="190" fill="#fffbeb" stroke="#d97706" class="state-card"/>
    <rect x="25" y="15" width="200" height="28" rx="6" fill="#fef3c7"/>
    <text x="125" y="34" class="state-title" fill="#b45309">🟡 HALF-OPEN</text>

    <text x="125" y="65" class="state-badge" fill="#92400e">Canary Trial Period</text>
    <line x1="20" y1="75" x2="230" y2="75" stroke="#fde68a" stroke-width="1.5"/>

    <text x="25" y="98" class="item-text">• Allows limited trial requests.</text>
    <text x="25" y="120" class="item-text">• Tests if downstream has healed.</text>
    <text x="25" y="142" class="item-text">• Remaining traffic still fails fast.</text>

    <rect x="20" y="158" width="210" height="22" rx="4" fill="#ffffff" stroke="#fcd34d"/>
    <text x="125" y="173" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">Traffic Status: Limited Trial Probes</text>
  </g>

  <!-- TRANSITION 1: CLOSED -> OPEN -->
  <path d="M 310 180 L 640 180" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="400" y="145" width="160" height="32" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="480" y="160" class="trans-label" fill="#b91c1c">Failure Threshold Reached</text>
  <text x="480" y="172" class="trans-sub">e.g., &gt;50% failure rate over 10s</text>

  <!-- TRANSITION 2: OPEN -> HALF-OPEN -->
  <path d="M 720 330 L 720 395 L 615 395" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <rect x="635" y="345" width="140" height="32" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="705" y="360" class="trans-label" fill="#b45309">Wait Duration Expires</text>
  <text x="705" y="372" class="trans-sub">SleepWindow (e.g., 30s elapsed)</text>

  <!-- TRANSITION 3: HALF-OPEN -> CLOSED (Success) -->
  <path d="M 355 395 L 240 395 L 240 335" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <rect x="180" y="350" width="135" height="32" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="247" y="365" class="trans-label" fill="#15803d">Trial Call Succeeds</text>
  <text x="247" y="377" class="trans-sub">Downstream healthy again</text>

  <!-- TRANSITION 4: HALF-OPEN -> OPEN (Failure) -->
  <path d="M 520 300 L 680 260" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <rect x="525" y="260" width="120" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="585" y="276" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Trial Call Fails</text>
</svg>
