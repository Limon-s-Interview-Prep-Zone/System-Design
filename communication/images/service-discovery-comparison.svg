<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .card { rx: 8; stroke-width: 1.5; filter: url(#shadow); }
    .node-box { rx: 6; stroke-width: 1.5; fill: #ffffff; filter: url(#shadow); }
    .node-title { font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .node-desc { font-size: 10.5px; fill: #64748b; text-anchor: middle; }
    .step-text { font-size: 10.5px; font-weight: 600; fill: #1e293b; }
  </style>

  <!-- Title -->
  <text x="480" y="32" class="title">Service Discovery Patterns: Client-Side vs. Server-Side</text>
  <text x="480" y="52" class="subtitle">How microservices locate and route traffic dynamically across ephemeral container instances</text>

  <!-- LEFT: CLIENT-SIDE DISCOVERY -->
  <rect x="25" y="80" width="445" height="460" rx="8" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
  <rect x="40" y="95" width="200" height="26" rx="4" fill="#dbeafe"/>
  <text x="140" y="112" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Pattern A: Client-Side Discovery</text>

  <!-- Registry (Top) -->
  <rect x="220" y="145" width="160" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="170" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Service Registry</text>
  <text x="300" y="188" font-size="10" fill="#92400e" text-anchor="middle">(Consul / Eureka)</text>

  <!-- Client Service -->
  <rect x="50" y="250" width="130" height="80" class="node-box" stroke="#3b82f6"/>
  <text x="115" y="278" class="node-title">Client Service</text>
  <text x="115" y="296" class="node-desc">Has discovery library</text>
  <text x="115" y="312" font-size="9.5" fill="#2563eb" text-anchor="middle">+ Client Load Balancer</text>

  <!-- Instances -->
  <rect x="300" y="250" width="150" height="45" class="node-box" stroke="#10b981"/>
  <text x="375" y="272" class="node-title">Service Instance 1</text>
  <text x="375" y="286" class="node-desc">IP: 10.0.1.20:5000</text>

  <rect x="300" y="315" width="150" height="45" class="node-box" stroke="#10b981"/>
  <text x="375" y="337" class="node-title">Service Instance 2</text>
  <text x="375" y="351" class="node-desc">IP: 10.0.1.21:5000</text>

  <!-- Arrows Client-side -->
  <!-- 1. Register -->
  <path d="M 375 250 L 375 210" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="385" y="230" font-size="9.5" fill="#059669" font-weight="600">Register</text>

  <!-- 2. Lookup -->
  <path d="M 130 250 L 130 175 L 210 175" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="160" y="165" class="step-text" fill="#b45309">1. Query Registry</text>

  <!-- 3. Return IP list -->
  <path d="M 210 190 L 150 190 L 150 250" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>
  <text x="185" y="210" class="step-text" fill="#b45309">2. IP List</text>

  <!-- 4. Direct Call -->
  <line x1="180" y1="285" x2="290" y2="272" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="235" y="268" class="step-text" fill="#1d4ed8">3. Direct Call</text>

  <!-- Client-side Summary Box -->
  <rect x="40" y="390" width="415" height="135" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="55" y="412" font-size="11.5" font-weight="700" fill="#0f172a">Trade-offs:</text>
  <text x="55" y="432" font-size="10.5" fill="#334155">✓ <tspan font-weight="600">Low Latency:</tspan> Direct call, no intermediary network hop.</text>
  <text x="55" y="452" font-size="10.5" fill="#334155">✓ <tspan font-weight="600">Flexible:</tspan> Client can choose custom load-balancing logic.</text>
  <text x="55" y="472" font-size="10.5" fill="#dc2626">✗ <tspan font-weight="600">Coupling:</tspan> Client requires language-specific SDK/library.</text>
  <text x="55" y="492" font-size="10.5" fill="#dc2626">✗ <tspan font-weight="600">Polyglot Penalty:</tspan> Every tech stack (C#, Java, Go) needs client code.</text>

  <!-- RIGHT: SERVER-SIDE DISCOVERY -->
  <rect x="490" y="80" width="445" height="460" rx="8" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
  <rect x="505" y="95" width="200" height="26" rx="4" fill="#dcfce7"/>
  <text x="605" y="112" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Pattern B: Server-Side Discovery</text>

  <!-- Client Service (Simple) -->
  <rect x="505" y="260" width="115" height="65" class="node-box" stroke="#64748b"/>
  <text x="562" y="290" class="node-title">Client Service</text>
  <text x="562" y="306" class="node-desc">Simple HTTP Call</text>

  <!-- Load Balancer / Gateway / K8s Service -->
  <rect x="660" y="250" width="125" height="85" class="node-box" stroke="#3b82f6" fill="#eff6ff"/>
  <text x="722" y="278" class="node-title">Load Balancer /</text>
  <text x="722" y="294" class="node-title">K8s Service</text>
  <text x="722" y="314" class="node-desc">(AWS ALB / CoreDNS)</text>

  <!-- Registry (Top) -->
  <rect x="660" y="145" width="125" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="722" y="170" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Service Registry</text>
  <text x="722" y="186" font-size="9.5" fill="#92400e" text-anchor="middle">(K8s etcd / Consul)</text>

  <!-- Instances -->
  <rect x="830" y="250" width="95" height="45" class="node-box" stroke="#10b981"/>
  <text x="877" y="272" class="node-title">Pod 1</text>
  <text x="877" y="286" class="node-desc">10.244.1.5</text>

  <rect x="830" y="315" width="95" height="45" class="node-box" stroke="#10b981"/>
  <text x="877" y="337" class="node-title">Pod 2</text>
  <text x="877" y="351" class="node-desc">10.244.2.8</text>

  <!-- Arrows Server-side -->
  <!-- Client to LB -->
  <line x1="620" y1="292" x2="650" y2="292" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>
  <text x="635" y="284" font-size="9.5" font-weight="700" text-anchor="middle">1. Call</text>

  <!-- LB to Registry -->
  <line x1="722" y1="250" x2="722" y2="205" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="732" y="230" font-size="9.5" fill="#b45309" font-weight="600">Query</text>

  <!-- Instances register -->
  <path d="M 877 250 L 877 175 L 790 175" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="850" y="165" font-size="9" fill="#059669" font-weight="600">Heartbeat</text>

  <!-- LB to Instance -->
  <line x1="785" y1="280" x2="820" y2="272" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="785" y1="305" x2="820" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="805" y="260" font-size="9.5" fill="#2563eb" font-weight="600">2. Route</text>

  <!-- Server-side Summary Box -->
  <rect x="505" y="390" width="415" height="135" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="520" y="412" font-size="11.5" font-weight="700" fill="#0f172a">Trade-offs:</text>
  <text x="520" y="432" font-size="10.5" fill="#334155">✓ <tspan font-weight="600">Polyglot Friendly:</tspan> Client needs zero discovery libraries (DNS/HTTP).</text>
  <text x="520" y="452" font-size="10.5" fill="#334155">✓ <tspan font-weight="600">Centralized Governance:</tspan> Health checks, TLS, retries at proxy.</text>
  <text x="520" y="472" font-size="10.5" fill="#dc2626">✗ <tspan font-weight="600">Extra Hop:</tspan> Small latency penalty through intermediary proxy/LB.</text>
  <text x="520" y="492" font-size="10.5" fill="#dc2626">✗ <tspan font-weight="600">HA Required:</tspan> Load balancer must be highly available to avoid SPOF.</text>
</svg>
