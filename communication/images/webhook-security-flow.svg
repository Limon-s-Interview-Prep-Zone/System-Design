<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1120" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .actor-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 8; filter: url(#shadow); }
    .actor-text { font-size: 14px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .lifeline { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6, 6; }
    .note-rect { fill: #fef9c3; stroke: #eab308; stroke-width: 1.5; rx: 5; }
    .note-text { font-size: 12px; fill: #713f12; font-weight: 500; }
    .msg-line { stroke: #1e293b; stroke-width: 1.8; }
    .msg-dashed { stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 4, 4; }
    .msg-red { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 4, 4; }
    .msg-text { font-size: 12.5px; fill: #0f172a; font-weight: 600; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .group-box-blue { fill: #f0f8ff; stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 4, 4; rx: 8; }
    .group-box-pink { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.5; stroke-dasharray: 4, 4; rx: 8; }
    .group-box-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; stroke-dasharray: 4, 4; rx: 8; }
    .group-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Title -->
  <text x="460" y="38" class="title">Secure &amp; Reliable Webhook Architecture Lifecycle</text>

  <!-- Actors Header -->
  <rect x="120" y="60" width="220" height="46" class="actor-box"/>
  <text x="230" y="88" class="actor-text">Event Source (Sender)</text>

  <rect x="580" y="60" width="220" height="46" class="actor-box"/>
  <text x="690" y="88" class="actor-text">Webhook Receiver (API)</text>

  <!-- Lifelines -->
  <line x1="230" y1="106" x2="230" y2="1040" class="lifeline"/>
  <line x1="690" y1="106" x2="690" y2="1040" class="lifeline"/>

  <!-- Note: Security Layer 1 -->
  <rect x="250" y="120" width="420" height="30" class="note-rect"/>
  <text x="460" y="140" class="note-text" text-anchor="middle">🔒 Security Layer 1: Network (TLS/SSL &amp; IP Whitelisting)</text>

  <!-- Group: Security Layer 2 (Payload Signing) -->
  <rect x="70" y="165" width="370" height="175" class="group-box-blue"/>
  <text x="85" y="185" class="group-title" fill="#1d4ed8">Security Layer 2: Payload Signing</text>

  <rect x="100" y="200" width="260" height="24" rx="4" fill="#dbeafe"/>
  <text x="230" y="216" class="note-text" fill="#1e40af" text-anchor="middle">Timespan: T0 (Event Triggered)</text>

  <!-- Self call: Generate Payload -->
  <path d="M 230 240 L 280 240 L 280 260 L 232 260" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="290" y="255" class="msg-text">1. Generate Payload Data</text>

  <!-- Self call: Compute HMAC -->
  <path d="M 230 280 L 280 280 L 280 300 L 232 300" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="290" y="292" class="msg-text">2. Compute HMAC-SHA256</text>
  <text x="290" y="306" font-size="11" fill="#64748b">(payload + shared_secret)</text>

  <text x="230" y="328" font-size="11.5" fill="#1e3a8a" font-weight="600" text-anchor="middle">Headers: X-Signature: [hash], X-Timestamp: T0</text>

  <!-- Message: Network Latency Note -->
  <rect x="330" y="355" width="260" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="460" y="370" font-size="11" fill="#475569" text-anchor="middle">Timespan: Network Latency (T1 - T0)</text>

  <!-- Message: HTTP POST -->
  <line x1="230" y1="395" x2="688" y2="395" class="msg-line" marker-end="url(#arrow)"/>
  <circle cx="230" cy="395" r="3" fill="#1e293b"/>
  <text x="460" y="390" class="msg-text" text-anchor="middle">POST /webhook-endpoint (HTTPS)</text>
  <text x="460" y="408" font-size="11.5" fill="#475569" text-anchor="middle">[ Payload + Signature + Timestamp ]</text>

  <!-- Group: Security Layer 3 (Receiver Verification) -->
  <rect x="470" y="425" width="380" height="390" class="group-box-pink"/>
  <text x="485" y="445" class="group-title" fill="#be123c">Security Layer 3: Receiver Verification</text>

  <rect x="540" y="455" width="220" height="24" rx="4" fill="#ffe4e6"/>
  <text x="650" y="471" class="note-text" fill="#9f1239" text-anchor="middle">Timespan: T1 (Request Received)</text>

  <!-- Self calls: Verifications -->
  <path d="M 690 495 L 740 495 L 740 515 L 692 515" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="748" y="510" class="msg-text">1. Verify TLS Certificate</text>

  <path d="M 690 530 L 740 530 L 740 550 L 692 550" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="748" y="545" class="msg-text">2. Check IP Whitelist</text>

  <path d="M 690 565 L 740 565 L 740 585 L 692 585" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="748" y="575" class="msg-text">3. Check X-Timestamp</text>
  <text x="748" y="590" font-size="11" fill="#dc2626">(Reject if T1 - T0 &gt; 5m: Anti-Replay)</text>

  <path d="M 690 605 L 740 605 L 740 625 L 692 625" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="748" y="618" class="msg-text">4. Recompute HMAC Locally</text>
  <text x="748" y="632" font-size="11" fill="#64748b">Compare with X-Signature header</text>

  <!-- Alt Block Header: Valid -->
  <rect x="490" y="650" width="340" height="95" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="500" y="668" font-size="12" font-weight="700" fill="#166534">✓ [ALT: Signature &amp; Timestamp Valid]</text>

  <!-- Response 200 OK -->
  <line x1="690" y1="685" x2="232" y2="685" class="msg-dashed" marker-end="url(#arrow-dashed)"/>
  <text x="460" y="680" class="msg-text" fill="#2563eb" text-anchor="middle">HTTP 200 OK (Accepted immediately at T2)</text>

  <!-- Async Queue -->
  <path d="M 690 705 L 740 705 L 740 725 L 692 725" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="748" y="720" class="msg-text" fill="#15803d">Queue to Kafka/RabbitMQ (T3 Async)</text>

  <!-- Alt Block Header: Invalid -->
  <rect x="490" y="755" width="340" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="500" y="773" font-size="12" font-weight="700" fill="#991b1b">✗ [ALT: Signature Invalid / Expired]</text>

  <line x1="690" y1="788" x2="232" y2="788" class="msg-red" marker-end="url(#arrow-red)"/>
  <text x="460" y="783" class="msg-text" fill="#dc2626" text-anchor="middle">HTTP 401 Unauthorized (Do NOT retry)</text>

  <!-- Opt: Timeout & Retry -->
  <rect x="70" y="835" width="780" height="155" class="group-box-amber"/>
  <text x="85" y="855" class="group-title" fill="#b45309">OPT: Timespan Exceeded (Receiver Slow or Down)</text>

  <rect x="100" y="870" width="280" height="24" rx="4" fill="#fef3c7"/>
  <text x="240" y="886" class="note-text" fill="#92400e" text-anchor="middle">Timespan: T4 (Timeout reached, e.g. &gt; 5s)</text>

  <path d="M 230 910 L 280 910 L 280 930 L 232 930" fill="none" class="msg-line" marker-end="url(#arrow)"/>
  <text x="290" y="922" class="msg-text">No 200 OK received within 5s</text>
  <text x="290" y="936" font-size="11" fill="#64748b">Exponential Backoff with Full Jitter</text>

  <line x1="230" y1="965" x2="688" y2="965" class="msg-line" stroke="#d97706" marker-end="url(#arrow)"/>
  <text x="460" y="960" class="msg-text" fill="#b45309" text-anchor="middle">Retry POST /webhook-endpoint (Attempt 2, 3...)</text>

  <!-- Bottom Actors -->
  <rect x="120" y="1040" width="220" height="46" class="actor-box"/>
  <text x="230" y="1068" class="actor-text">Event Source (Sender)</text>

  <rect x="580" y="1040" width="220" height="46" class="actor-box"/>
  <text x="690" y="1068" class="actor-text">Webhook Receiver (API)</text>
</svg>
