<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .section-head { font-size: 14px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
    .card-title { font-size: 15px; font-weight: 700; }
    .card-body { font-size: 11.5px; fill: #475569; line-height: 1.4; }
    .badge { font-size: 10px; font-weight: 700; text-anchor: middle; }
    .flow-label { font-size: 11px; font-weight: 600; fill: #334155; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="550" y="38" class="title">Strategic Domain-Driven Design (DDD) Architecture</text>
  <text x="550" y="60" class="subtitle">Problem Space (Subdomains) to Solution Space (Bounded Contexts &amp; Context Mapping)</text>

  <!-- PROBLEM SPACE (Top Container) -->
  <rect x="40" y="80" width="1020" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6,4" />
  <text x="60" y="108" class="section-head">PROBLEM SPACE (Business Domain Analysis)</text>
  <text x="60" y="125" font-size="11" fill="#64748b">Ubiquitous Language defines domain terminology within specific boundaries</text>

  <!-- Core Domain Card -->
  <g transform="translate(60, 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="15" y="15" width="105" height="22" rx="4" fill="#dbeafe"/>
    <text x="67" y="30" class="badge" fill="#1d4ed8">CORE DOMAIN</text>
    <text x="15" y="62" class="card-title" fill="#1e3a8a">Order Fulfillment &amp; Pricing</text>
    <text x="15" y="86" class="card-body">Primary competitive advantage &amp; ROI.</text>
    <text x="15" y="106" class="card-body">High complexity, custom logic, high change rate.</text>
    <text x="15" y="126" class="card-body" font-weight="600" fill="#2563eb">→ Invest best engineers &amp; clean DDD.</text>
  </g>

  <!-- Supporting Subdomain Card -->
  <g transform="translate(400, 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="150" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="15" y="15" width="145" height="22" rx="4" fill="#dcfce7"/>
    <text x="87" y="30" class="badge" fill="#15803d">SUPPORTING SUBDOMAIN</text>
    <text x="15" y="62" class="card-title" fill="#14532d">Inventory &amp; Stock Tracking</text>
    <text x="15" y="86" class="card-body">Complements the core domain business.</text>
    <text x="15" y="106" class="card-body">No off-the-shelf fit, but not competitive differentiator.</text>
    <text x="15" y="126" class="card-body" font-weight="600" fill="#16a34a">→ Custom built or internal light service.</text>
  </g>

  <!-- Generic Subdomain Card -->
  <g transform="translate(740, 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="150" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="22" rx="4" fill="#fef9c3"/>
    <text x="80" y="30" class="badge" fill="#a16207">GENERIC SUBDOMAIN</text>
    <text x="15" y="62" class="card-title" fill="#713f12">Billing &amp; Identity / Auth</text>
    <text x="15" y="86" class="card-body">Standard industry problems.</text>
    <text x="15" y="106" class="card-body">Not unique to business; standard compliance.</text>
    <text x="15" y="126" class="card-body" font-weight="600" fill="#ca8a04">→ Buy SaaS / Off-the-shelf (Stripe, Keycloak).</text>
  </g>

  <!-- SOLUTION SPACE (Bottom Container) -->
  <rect x="40" y="340" width="1020" height="320" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="368" class="section-head">SOLUTION SPACE (Bounded Contexts &amp; Context Mapping)</text>
  <text x="60" y="385" font-size="11" fill="#64748b">Each Bounded Context owns its domain models, persistence, and ubiquitous definitions</text>

  <!-- Bounded Context A: Ordering Context -->
  <g transform="translate(60, 405)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="235" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="15" y="15" width="170" height="24" rx="4" fill="#eff6ff"/>
    <text x="100" y="32" class="badge" fill="#1d4ed8">BOUNDED CONTEXT: ORDERING</text>
    <text x="15" y="65" font-size="13" font-weight="700" fill="#0f172a">Ubiquitous Language Context:</text>
    <text x="15" y="88" class="card-body">• <tspan font-weight="700">"Customer"</tspan> = Purchaser with Cart</text>
    <text x="15" y="108" class="card-body">• <tspan font-weight="700">"Item"</tspan> = Line Item with Price/Discount</text>
    <text x="15" y="128" class="card-body">• <tspan font-weight="700">"Order"</tspan> = Aggregate Root (Created, Paid)</text>
    <line x1="15" y1="145" x2="265" y2="145" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="15" y="158" width="250" height="32" rx="4" fill="#f1f5f9"/>
    <text x="140" y="178" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Role: Upstream (U) / Open Host Service</text>
    <text x="140" y="215" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Publishes: OrderPlacedEvent</text>
  </g>

  <!-- Relationship 1: Order to Inventory via Customer/Supplier -->
  <path d="M 340 500 L 410 500" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text x="375" y="485" class="flow-label">Events / DTO</text>
  <text x="375" y="525" font-size="9.5" fill="#64748b" text-anchor="middle">Async Queue</text>

  <!-- Bounded Context B: Inventory Context -->
  <g transform="translate(420, 405)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="235" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="15" y="15" width="180" height="24" rx="4" fill="#f0fdf4"/>
    <text x="105" y="32" class="badge" fill="#15803d">BOUNDED CONTEXT: INVENTORY</text>
    <text x="15" y="65" font-size="13" font-weight="700" fill="#0f172a">Ubiquitous Language Context:</text>
    <text x="15" y="88" class="card-body">• <tspan font-weight="700">"Item"</tspan> = SKU / Stock Keeping Unit</text>
    <text x="15" y="108" class="card-body">• <tspan font-weight="700">"Location"</tspan> = Warehouse Aisle/Bin</text>
    <text x="15" y="128" class="card-body">• <tspan font-weight="700">"Reservation"</tspan> = Stock Lock Aggregate</text>
    <line x1="15" y1="145" x2="265" y2="145" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="15" y="158" width="250" height="32" rx="4" fill="#f1f5f9"/>
    <text x="140" y="178" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Role: Downstream (D) / Consumer</text>
    <text x="140" y="215" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">Customer / Supplier Relationship</text>
  </g>

  <!-- Relationship 2: ACL Integration to Legacy Billing / Generic SaaS -->
  <path d="M 700 500 L 760 500" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- Anti-Corruption Layer (ACL) Box -->
  <g transform="translate(735, 460)">
    <rect x="0" y="0" width="70" height="80" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="35" y="30" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">ACL</text>
    <text x="35" y="48" font-size="9" font-weight="600" fill="#b45309" text-anchor="middle">Adapter</text>
    <text x="35" y="64" font-size="8.5" fill="#78350f" text-anchor="middle">+ Mapper</text>
  </g>

  <!-- Bounded Context C: Billing / External SaaS Context -->
  <g transform="translate(830, 405)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="235" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <rect x="15" y="15" width="180" height="24" rx="4" fill="#fff7ed"/>
    <text x="105" y="32" class="badge" fill="#c2410c">EXTERNAL / PAYMENT CONTEXT</text>
    <text x="15" y="65" font-size="13" font-weight="700" fill="#0f172a">Payment Gateway</text>
    <text x="15" y="88" class="card-body">• Stripe / PayPal API</text>
    <text x="15" y="108" class="card-body">• Charge tokens, webhooks</text>
    <text x="15" y="128" class="card-body">• External data models</text>
    <line x1="15" y1="145" x2="195" y2="145" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="10" y="158" width="190" height="60" rx="4" fill="#fffbeb"/>
    <text x="105" y="178" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Protected by ACL</text>
    <text x="105" y="196" font-size="9" fill="#78350f" text-anchor="middle">Prevents 3rd-party vendor model</text>
    <text x="105" y="210" font-size="9" fill="#78350f" text-anchor="middle">from polluting internal domain</text>
  </g>
</svg>
