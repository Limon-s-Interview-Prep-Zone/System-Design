<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="b-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="960" height="520" fill="url(#bg3)" rx="12"/>

  <text x="480" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">Event-Driven Architecture (EDA): Mediator vs. Broker Topology</text>
  <text x="480" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Centralized Orchestration (Control &amp; Visibility) vs. Decentralized Choreography (Throughput &amp; Agility)</text>

  <!-- Left: Mediator Topology -->
  <g transform="translate(40, 95)">
    <rect width="425" height="400" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="212" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa" text-anchor="middle">1. Mediator Topology (Orchestration)</text>
    <text x="212" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Workflow Controller • State Machine • Error Compensation</text>

    <!-- Initial Event -->
    <rect x="25" y="80" width="130" height="40" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">Initial Event</text>

    <!-- Arrow to Queue -->
    <line x1="155" y1="100" x2="200" y2="100" stroke="#a78bfa" stroke-width="2" marker-end="url(#m-arrow)"/>

    <!-- Ingress Queue -->
    <rect x="205" y="80" width="195" height="40" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="302" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#c7d2fe" text-anchor="middle">Ingress Queue</text>

    <!-- Arrow down to Mediator -->
    <line x1="302" y1="120" x2="302" y2="155" stroke="#a78bfa" stroke-width="2" marker-end="url(#m-arrow)"/>

    <!-- Event Mediator -->
    <rect x="75" y="155" width="275" height="55" rx="8" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="212" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Event Mediator (Orchestrator)</text>
    <text x="212" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ddd6fe" text-anchor="middle">State Machine / Saga Coordinator (MassTransit / Temporal)</text>

    <!-- Processing Channels & Processors -->
    <!-- Step 1 -->
    <line x1="140" y1="210" x2="90" y2="250" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m-arrow)"/>
    <rect x="30" y="255" width="115" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="87" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Inventory Service</text>
    <text x="87" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Reserve Stock</text>

    <!-- Step 2 -->
    <line x1="212" y1="210" x2="212" y2="250" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m-arrow)"/>
    <rect x="155" y="255" width="115" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="212" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Payment Service</text>
    <text x="212" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Authorize Card</text>

    <!-- Step 3 -->
    <line x1="285" y1="210" x2="335" y2="250" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#m-arrow)"/>
    <rect x="280" y="255" width="115" height="50" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="337" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Shipping Service</text>
    <text x="337" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Generate Label</text>

    <!-- Pros / Cons -->
    <rect x="25" y="325" width="375" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4ade80">✔ Pros: Centralized audit, easy error handling &amp; rollbacks</text>
    <text x="35" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">✖ Cons: Mediator bottleneck risk, higher architectural coupling</text>
  </g>

  <!-- Right: Broker Topology -->
  <g transform="translate(495, 95)">
    <rect width="425" height="400" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="212" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">2. Broker Topology (Choreography)</text>
    <text x="212" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Decentralized • Event Broadcast • Highly Scalable Pub/Sub</text>

    <!-- Producer -->
    <rect x="25" y="80" width="105" height="45" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="77" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Order Service</text>
    <text x="77" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bae6fd" text-anchor="middle">(Publishes OrderPlaced)</text>

    <!-- Arrow to Message Broker -->
    <line x1="130" y1="102" x2="165" y2="102" stroke="#38bdf8" stroke-width="2" marker-end="url(#b-arrow)"/>

    <!-- Central Broker Topic -->
    <rect x="170" y="75" width="230" height="55" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="285" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Message Broker (Kafka / RabbitMQ)</text>
    <text x="285" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Topic: "orders.placed" (Fan-out Pub/Sub)</text>

    <!-- Fan-out Arrows -->
    <line x1="285" y1="130" x2="90" y2="175" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <line x1="285" y1="130" x2="212" y2="175" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <line x1="285" y1="130" x2="335" y2="175" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#b-arrow)"/>

    <!-- Consumers -->
    <!-- Consumer 1 -->
    <rect x="30" y="180" width="115" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="87" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Billing Service</text>
    <text x="87" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Charges Account</text>

    <!-- Consumer 2 -->
    <rect x="155" y="180" width="115" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="212" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Email Service</text>
    <text x="212" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Sends Receipt</text>

    <!-- Consumer 3 -->
    <rect x="280" y="180" width="115" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="337" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Analytics Service</text>
    <text x="337" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Updates Metrics</text>

    <!-- Chained Event from Billing -->
    <line x1="87" y1="230" x2="87" y2="265" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#b-arrow)"/>
    <rect x="30" y="270" width="365" height="35" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="212" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Billing emits "InvoicePaid" ➔ Shipping listens autonomously</text>

    <!-- Pros / Cons -->
    <rect x="25" y="325" width="375" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4ade80">✔ Pros: Extreme scalability, dynamic subscriber addition</text>
    <text x="35" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">✖ Cons: Flow visibility is distributed, tracing failures is difficult</text>
  </g>
</svg>

