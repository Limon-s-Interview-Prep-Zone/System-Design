<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="520" fill="url(#bg4)" rx="12"/>

  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">CQRS &amp; Event Sourcing Architecture Flow</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Decoupled Command (Write) &amp; Query (Read) pipelines with Append-Only Event Store &amp; Projections</text>

  <!-- Client Layer on the Left -->
  <g transform="translate(40, 95)">
    <rect width="130" height="395" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="65" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Client App</text>
    <text x="65" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(Web / Mobile / API)</text>

    <!-- Command Trigger Box -->
    <rect x="15" y="90" width="100" height="50" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
    <text x="65" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">Command</text>
    <text x="65" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fef08a" text-anchor="middle">"PlaceOrder"</text>

    <!-- Query Trigger Box -->
    <rect x="15" y="275" width="100" height="50" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#bae6fd" text-anchor="middle">Query</text>
    <text x="65" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bae6fd" text-anchor="middle">"GetOrderSummary"</text>
  </g>

  <!-- Command (Write) Model (Top Track) -->
  <g transform="translate(200, 95)">
    <rect width="720" height="175" rx="10" fill="#1e293b" stroke="#d97706" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">COMMAND SIDE (WRITE MODEL: Invariants &amp; Append-Only State Transitions)</text>

    <!-- Command Handler -->
    <rect x="20" y="45" width="170" height="70" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
    <text x="105" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">Command Handler</text>
    <text x="105" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d1d5db" text-anchor="middle">Validates Business Rules</text>
    <text x="105" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Loads Aggregate Stream</text>

    <!-- Arrow Handler to Aggregate -->
    <line x1="190" y1="80" x2="230" y2="80" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-c)"/>

    <!-- Aggregate Root -->
    <rect x="235" y="45" width="180" height="70" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
    <text x="325" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">Aggregate Root</text>
    <text x="325" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d1d5db" text-anchor="middle">Rehydrates from History</text>
    <text x="325" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Emits: OrderPlacedEvent</text>

    <!-- Arrow Aggregate to Event Store -->
    <line x1="415" y1="80" x2="455" y2="80" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-c)"/>

    <!-- Event Store -->
    <rect x="460" y="45" width="235" height="70" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="577" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">Event Store (Source of Truth)</text>
    <text x="577" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">Append-Only Immutable Log</text>
    <text x="577" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#fef3c7" text-anchor="middle">(Marten PostgreSQL / EventStoreDB)</text>

    <text x="20" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">✔ Guaranteed Consistency: Optimistic Concurrency on Stream Version (E.g. ExpectedVersion == 3)</text>
  </g>

  <!-- Command Arrow from Client -->
  <line x1="170" y1="210" x2="215" y2="175" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-c)"/>

  <!-- Vertical Asynchronous Projection Link -->
  <g transform="translate(680, 270)">
    <line x1="55" y1="0" x2="55" y2="45" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#arrow-p)"/>
    <rect x="0" y="10" width="110" height="25" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="55" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Async Projection</text>
  </g>

  <!-- Query (Read) Model (Bottom Track) -->
  <g transform="translate(200, 315)">
    <rect width="720" height="175" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow4)"/>
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">QUERY SIDE (READ MODEL: Denormalized &amp; Optimized for Blazing-Fast Reads)</text>

    <!-- Query Handler -->
    <rect x="20" y="45" width="170" height="70" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="105" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#bae6fd" text-anchor="middle">Query Handler</text>
    <text x="105" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d1d5db" text-anchor="middle">Direct DTO Query</text>
    <text x="105" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">Zero Joins / Zero Invariants</text>

    <!-- Arrow Query Handler to Read DB -->
    <line x1="190" y1="80" x2="230" y2="80" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-q)"/>

    <!-- Read Model Database -->
    <rect x="235" y="45" width="220" height="70" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1.5"/>
    <text x="345" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Read Model / Projections</text>
    <text x="345" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">Flat Denormalized Views</text>
    <text x="345" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#bae6fd" text-anchor="middle">Elasticsearch / Redis / Read DB</text>

    <!-- Arrow Projection Engine to Read DB -->
    <line x1="515" y1="80" x2="460" y2="80" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-p)"/>

    <!-- Projection Engine Worker -->
    <rect x="520" y="45" width="175" height="70" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="607" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">Projection Engine</text>
    <text x="607" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Consumes Event Stream</text>
    <text x="607" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#d1fae5" text-anchor="middle">Background Worker / Daemon</text>

    <text x="20" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">⚡ Read Optimized: Sub-millisecond reads without touching relational normalization bottlenecks</text>
  </g>

  <!-- Query Arrow from Client -->
  <line x1="170" y1="395" x2="215" y2="395" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-q)"/>
</svg>

