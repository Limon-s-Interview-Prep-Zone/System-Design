<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-angle">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 20px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #64748b; text-anchor: middle; }
    .card { rx: 8; stroke-width: 1.5; fill: #ffffff; filter: url(#shadow); }
    .header-badge { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .node-title { font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .desc { font-size: 10.5px; fill: #334155; }
    .bold { font-weight: 600; }
  </style>

  <!-- Title & Subtitle -->
  <text x="510" y="32" class="title">Trace Sampling Strategies: Head-Based vs. Tail-Based</text>
  <text x="510" y="52" class="subtitle">Managing high-throughput telemetry cost without sacrificing visibility into rare production errors</text>

  <!-- LEFT: HEAD-BASED SAMPLING -->
  <g transform="translate(30, 75)">
    <rect width="460" height="380" class="card" stroke="#cbd5e1" fill="#f8fafc"/>
    <rect width="460" height="32" rx="8" fill="#fee2e2"/>
    <text x="230" y="21" class="header-badge" fill="#991b1b">Pattern A: Head-Based Sampling (At Ingress / SDK)</text>

    <!-- Visual Sequence -->
    <!-- Request Arrives -->
    <rect x="25" y="55" width="130" height="50" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="90" y="76" class="node-title">Client Request</text>
    <text x="90" y="92" font-size="9" fill="#64748b" text-anchor="middle">100,000 req/sec</text>

    <!-- Arrow to Sampler -->
    <line x1="155" y1="80" x2="200" y2="80" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-navy)"/>

    <!-- Ingress Sampler -->
    <rect x="205" y="48" width="230" height="65" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="320" y="70" class="node-title" fill="#991b1b">Ingress Decision Maker</text>
    <text x="320" y="85" font-size="9.5" fill="#b91c1c" text-anchor="middle">Coin Toss: Sample 5% of traffic</text>
    <text x="320" y="99" font-size="9" fill="#7f1d1d" text-anchor="middle">(Decision made BEFORE execution)</text>

    <!-- Split Branches -->
    <!-- Branch 1: Dropped 95% -->
    <path d="M 320 113 L 320 145 L 210 145" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <rect x="30" y="130" width="175" height="40" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="117" y="148" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">95% Dropped Immediately</text>
    <text x="117" y="161" font-size="8.5" fill="#7f1d1d" text-anchor="middle">No traceparent created; zero bytes</text>

    <!-- Branch 2: Kept 5% -->
    <path d="M 320 113 L 320 145 L 350 145" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>
    <rect x="355" y="130" width="85" height="40" rx="4" fill="#ecfdf5" stroke="#86efac"/>
    <text x="397" y="148" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">5% Traced</text>
    <text x="397" y="161" font-size="8.5" fill="#065f46" text-anchor="middle">Stored in DB</text>

    <!-- The Critical Pitfall Box -->
    <rect x="25" y="190" width="410" height="75" rx="5" fill="#ffffff" stroke="#fca5a5"/>
    <text x="35" y="212" font-size="10.5" font-weight="700" fill="#dc2626">The Fatal Flaw of Head-Based Sampling:</text>
    <text x="35" y="230" class="desc">• If a 500 Internal Server Error occurs inside the 95% dropped bucket,</text>
    <text x="35" y="248" class="desc">  <tspan class="bold">you have ZERO trace data</tspan> to diagnose what went wrong in production!</text>

    <!-- Summary Box -->
    <rect x="25" y="275" width="410" height="90" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="35" y="295" font-size="10.5" font-weight="700" fill="#0f172a">Characteristics &amp; Trade-offs:</text>
    <text x="35" y="313" class="desc">✓ <tspan class="bold">Ultra-Low Overhead:</tspan> Drops network &amp; memory pressure at ingress.</text>
    <text x="35" y="331" class="desc">✓ <tspan class="bold">Dead Simple:</tspan> Configured with 1 line in SDK (`TraceIdRatioBased(0.05)`).</text>
    <text x="35" y="349" class="desc" fill="#dc2626">✗ <tspan class="bold">Blind to Anomalies:</tspan> Completely misses rare p99.9 latency spikes and crashes.</text>
  </g>


  <!-- RIGHT: TAIL-BASED SAMPLING -->
  <g transform="translate(530, 75)">
    <rect width="460" height="380" class="card" stroke="#93c5fd" fill="#eff6ff"/>
    <rect width="460" height="32" rx="8" fill="#dbeafe"/>
    <text x="230" y="21" class="header-badge" fill="#1e40af">Pattern B: Tail-Based Sampling (At OTel Collector)</text>

    <!-- Visual Sequence -->
    <!-- Request Arrives -->
    <rect x="25" y="55" width="130" height="50" rx="5" fill="#ffffff" stroke="#94a3b8"/>
    <text x="90" y="76" class="node-title">100% Requests</text>
    <text x="90" y="92" font-size="9" fill="#64748b" text-anchor="middle">Fully Traced in App</text>

    <!-- Arrow to Buffer -->
    <line x1="155" y1="80" x2="195" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Collector Buffer -->
    <rect x="200" y="48" width="235" height="65" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="317" y="70" class="node-title" fill="#1d4ed8">Collector Sliding Window</text>
    <text x="317" y="85" font-size="9.5" fill="#1e40af" text-anchor="middle">Holds all spans in RAM (10s buffer)</text>
    <text x="317" y="99" font-size="9" fill="#2563eb" text-anchor="middle">Evaluates policy AFTER request ends</text>

    <!-- Filter Logic Decision Engine -->
    <rect x="25" y="130" width="410" height="135" rx="5" fill="#ffffff" stroke="#3b82f6"/>
    <text x="35" y="150" font-size="10.5" font-weight="700" fill="#1e40af">Intelligent Filtering Policies Evaluated at Tail:</text>
    
    <text x="35" y="172" class="desc">• <tspan class="bold" fill="#dc2626">Did request throw an exception / HTTP 5xx?</tspan> ➔ <tspan class="bold" fill="#dc2626">KEEP 100%</tspan></text>
    <text x="35" y="192" class="desc">• <tspan class="bold" fill="#d97706">Did latency exceed SLA (duration &gt; 2000ms)?</tspan> ➔ <tspan class="bold" fill="#d97706">KEEP 100%</tspan></text>
    <text x="35" y="212" class="desc">• <tspan class="bold" fill="#4338ca">Is user a VIP customer (baggage: tier=enterprise)?</tspan> ➔ <tspan class="bold" fill="#4338ca">KEEP 100%</tspan></text>
    <text x="35" y="232" class="desc">• <tspan class="bold" fill="#059669">Routine, fast successful call (HTTP 200 &lt; 50ms)?</tspan> ➔ <tspan class="bold" fill="#059669">SAMPLE 0.1%</tspan></text>
    <text x="35" y="252" font-size="9.5" fill="#059669" font-weight="700">➔ Outcome: 100% of interesting anomalies kept; 99% of boring data purged!</text>

    <!-- Summary Box -->
    <rect x="25" y="275" width="410" height="90" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="35" y="295" font-size="10.5" font-weight="700" fill="#0f172a">Characteristics &amp; Trade-offs:</text>
    <text x="35" y="313" class="desc">✓ <tspan class="bold">100% Fault Capture:</tspan> Guaranteed root-cause visibility for every failure.</text>
    <text x="35" y="331" class="desc">✓ <tspan class="bold">Massive Cost Savings:</tspan> Drops high-volume healthy traces before storage.</text>
    <text x="35" y="349" class="desc" fill="#b45309">⚡ <tspan class="bold">Collector RAM Cost:</tspan> Collector nodes require memory buffer for in-flight traces.</text>
  </g>

  <!-- BOTTOM COMPARISON SUMMARY -->
  <g transform="translate(30, 470)">
    <rect width="960" height="110" class="card" stroke="#94a3b8" fill="#f8fafc"/>
    <rect width="960" height="26" rx="8" fill="#0f172a"/>
    <text x="480" y="18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Architectural Recommendation: When to Use Which Sampling Model?</text>

    <g transform="translate(30, 38)">
      <text x="0" y="18" font-size="11" font-weight="700" fill="#334155">Use Head-Based Sampling When:</text>
      <text x="0" y="36" class="desc">• Ingress network bandwidth or client CPU is the primary bottleneck.</text>
      <text x="0" y="52" class="desc">• High-volume uniform traffic where mathematical trends matter more than individual crashes.</text>

      <text x="490" y="18" font-size="11" font-weight="700" fill="#1e40af">Use Tail-Based Sampling (Recommended) When:</text>
      <text x="490" y="36" class="desc">• Running tier-0 microservices where capturing every rare payment failure or edge-case bug is non-negotiable.</text>
      <text x="490" y="52" class="desc">• You want to slash Jaeger/Tempo S3 storage bills by 80% while increasing diagnostic fidelity.</text>
    </g>
  </g>
</svg>
